source:
  path: "input/zostava.xlsx"
  sheet: 0
  header_row: 1
  data_start_row: 2
  account_parts:
    synthetic_col: "A"
    analytic_col: "B"
    synthetic_width: 3
    analytic_width: 3
  columns:
    eb_saldo: "M"
    peri_soll: "O"
    peri_haben: "P"
    kum_soll: "Q"
    kum_haben: "R"
    saldo: "S"
  number_format:
    decimal_comma: true
    thousands_sep_space: true
    negative_parens: true

template:
  path: "templates/Trial Balance_template.xlsx"
  sheet: 0
  header_row: 1
  data_start_row: 2
  account_col: "A"
  write_columns:
    eb_saldo: "G"
    peri_soll: "H"
    peri_haben: "I"
    kum_soll: "J"
    kum_haben: "K"
    saldo: "L"

output:
  dir: "output"
  filename: "Trial Balance_{date}.xlsx"
  date_format: "%Y-%m-%d"

rules:
  missing_in_source: "fill_zero"
  duplicate_accounts: "sum"
  debit_credit_check: true
  debit_credit_tolerance: 0.01
  closing_check: true
  closing_tolerance: 0.01
  debit_field: "peri_soll"
  credit_field: "peri_haben"
  closing_check_fields:
    opening_field: "eb_saldo"
    debit_field: "peri_soll"
    credit_field: "peri_haben"
    closing_field: "saldo"
