source:
  path: "input/zostava.xlsx"
  sheet: 0
  header_row: 1
  data_start_row: 2
  account_parts:
    synthetic_col: "A"
    analytic_col: "B"
    synthetic_width: 3
    analytic_width: 3
  columns:
    eb_saldo: "M"
    peri_soll: "O"
    peri_haben: "P"
    kum_soll: "Q"
    kum_haben: "R"
    saldo: "S"
  number_format:
    decimal_comma: true
    thousands_sep_space: true
    negative_parens: true

template:
  path: "templates/Trial Balance_template.xlsx"
  sheet: 0
  header_row: 1
  data_start_row: 2
  account_col: "A"
  write_columns:
    eb_saldo: "G"
    peri_soll: "H"
    peri_haben: "I"
    kum_soll: "J"
    kum_haben: "K"
    saldo: "L"

output:
  dir: "output"
  filename: "Trial Balance_{date}.xlsx"
  date_format: "%Y-%m-%d"

report:
  enabled: true
  output_dir: "output"
  filename: "Trial Balance_report_{date}.xlsx"
  date_format: "%Y-%m-%d"
  sheet_name: "Report"
  header_rows: "1:7"
  company_line: "5568/25FCS Fiber - Components - Slovakia s.r.o."
  company_address: "SK-94901 Nitra"
  report_title: "Saldenliste Sachkonten"
  report_number: "9204/7.8.2536"
  language: "GER"
  datetime_format: "%d.%m.%Y/%H:%M"
  period_label: "Periode 2025/11 - 2025/11"
  cumulative_label: "Kumuliert 2025/01 - 2025/11"

rules:
  missing_in_source: "fill_zero"
  duplicate_accounts: "sum"
  debit_credit_check: true
  debit_credit_tolerance: 0.01
  closing_check: true
  closing_tolerance: 0.01
  debit_field: "peri_soll"
  credit_field: "peri_haben"
  closing_check_fields:
    opening_field: "eb_saldo"
    debit_field: "peri_soll"
    credit_field: "peri_haben"
    closing_field: "saldo"
